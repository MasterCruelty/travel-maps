name: Pubblica su GitHub Pages

# Richiede: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp -r index.html style.css game.js data _site/
      # Ogni pubblicazione cambia l'indirizzo di stile, script e dati: così il browser
      # non mescola la pagina nuova con file vecchi ancora in cache.
      - run: sed -i "s/style.css\"/style.css?v=${GITHUB_SHA::8}\"/; s/game.js\"/game.js?v=${GITHUB_SHA::8}\"/" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
